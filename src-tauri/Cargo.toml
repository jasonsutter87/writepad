[package]
name = "writepad-app"
version = "0.1.1"
description = "WRITEpad: a writing desk with onion-skinned drafts and local narration"
edition = "2021"

[lib]
name = "writepad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
writepad-core = { path = "../crates/core" }
notify = "8"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
murmur-core = { path = "../../murmur/core" }
ureq = { version = "3.4", features = ["json"] }
