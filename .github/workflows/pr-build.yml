# Builds a Windows installer for every pull request so it can be tried before
# merging. Nothing is published: the installer is attached to the workflow run
# (Actions → this run → Artifacts → WRITEpad-windows-installer).
name: PR build

on:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      # WRITEpad builds dictation from murmur, which it expects next door (../murmur).
      - uses: actions/checkout@v4
        with:
          path: writepad
      - uses: actions/checkout@v4
        with:
          repository: jasonsutter87/murmur
          path: murmur

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: writepad/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: writepad -> target
          key: pr-windows

      - name: Install JS dependencies
        working-directory: writepad
        run: npm ci

      - name: Core tests
        working-directory: writepad
        run: cargo test -p writepad-core

      - name: Build the installer
        working-directory: writepad
        run: npx tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: WRITEpad-windows-installer
          path: writepad/target/release/bundle/nsis/*.exe
          retention-days: 14
