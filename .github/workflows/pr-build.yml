# Builds Windows and Linux installers for every pull request so they can be
# tried before merging. Nothing is published: the installers are attached to
# the workflow run (Actions → this run → Artifacts). PR builds aren't signed
# for auto-update; only releases have the signing key.
name: PR build

on:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      # WRITEpad builds dictation from murmur, which it expects next door (../murmur).
      - uses: actions/checkout@v4
        with:
          path: writepad
      - uses: actions/checkout@v4
        with:
          repository: jasonsutter87/murmur
          path: murmur

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: writepad/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: writepad -> target
          key: pr-windows

      - name: Install JS dependencies
        working-directory: writepad
        run: npm ci

      - name: Core tests
        working-directory: writepad
        run: cargo test -p writepad-core

      - name: Build the installer
        working-directory: writepad
        run: npx tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - uses: actions/upload-artifact@v4
        with:
          name: WRITEpad-windows-installer
          path: writepad/target/release/bundle/nsis/*.exe
          retention-days: 14

  linux:
    name: Linux package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: writepad
      - uses: actions/checkout@v4
        with:
          repository: jasonsutter87/murmur
          path: murmur

      # The webview, tray bits Tauri links, ALSA for dictation, clang/cmake for whisper.cpp.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libssl-dev build-essential cmake clang libclang-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: writepad/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: writepad -> target
          key: pr-linux

      - name: Install JS dependencies and type-check
        working-directory: writepad
        run: |
          npm ci
          npx tsc --noEmit

      - name: Tests
        working-directory: writepad
        run: cargo test -p writepad-core -p writepad-cli -p writepad-app

      - name: Build the package
        working-directory: writepad
        run: npx tauri build --bundles deb --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - uses: actions/upload-artifact@v4
        with:
          name: WRITEpad-linux-deb
          path: writepad/target/release/bundle/deb/*.deb
          retention-days: 14
