[package]
name = "writepad-cli"
version = "0.1.4"
edition = "2021"
description = "Headless WRITEpad: a CLI and an MCP server so agents can work on manuscripts."

[[bin]]
name = "writepad"
path = "src/main.rs"

[dependencies]
writepad-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
