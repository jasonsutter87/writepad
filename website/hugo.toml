baseURL = 'https://writepad.app/'
languageCode = 'en-us'
title = 'WRITEpad'
disableKinds = ['taxonomy', 'term']

[params]
CompanyName = 'WRITEpad'
description = 'A free, open-source writing desk: versions you can onion-skin, local narration, dictation, and a library that measures the books you learn from.'
# The latest published release (GitHub Releases), shown in the footer and the
# app's structured data. Bump it when a release goes out.
version = '0.1.4'
repoURL = 'https://github.com/jasonsutter87/writepad'
releasesURL = 'https://github.com/jasonsutter87/writepad/releases/latest'
issuesURL = 'https://github.com/jasonsutter87/writepad/issues'
# Checkout link for the $5 Publish unlock (Lemon Squeezy, Gumroad, Stripe Payment Link...).
# Leave empty and the buy buttons say "Coming soon".
buyURL = ''
price = '$5'
author = 'Jason Sutter'
# Help topics are grouped on /docs/ in this order (each page sets `group`).
docGroups = ['Getting started', 'Write and revise', 'Your story world', 'Listen and measure', 'Share your work']

[environments.development]
baseURL = 'http://localhost:1313/'

[environments.production]
baseURL = 'https://writepad.app/'
