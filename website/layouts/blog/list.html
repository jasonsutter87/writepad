{{ define "main" }}
<section class="page-hero">
  <div class="container">
    <p class="eyebrow mb-2">Blog</p>
    <h1>{{ .Params.heading | default .Title }}</h1>
    <p class="lede">{{ .Description }}</p>
  </div>
</section>

<section class="container post-list">
  <div class="post-grid">
    {{ range .Pages.ByDate.Reverse }}{{ partial "post-card.html" . }}{{ end }}
  </div>
</section>
{{ end }}
